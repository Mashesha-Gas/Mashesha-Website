name: Build and Push to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: af-south-1
  ECR_REPOSITORY: mashesha-website

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push staging image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_URL=https://staging-api.mashesha.co.za \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Vite bakes VITE_* vars into the JS bundle at build time, so the
      # staging image above can never serve prod — it needs its own build
      # pointed at the prod API, pushed under a separate tag so
      # docker-compose.yml (prod) and
      # docker-compose.staging.yml can each pull the variant that matches
      # their domain.
      - name: Build, tag, and push prod image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_URL=https://api.mashesha.co.za \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:prod-$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:prod-$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:prod
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:prod-$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:prod

      - name: Image digest
        run: echo "Image pushed with tag ${{ github.sha }}"
