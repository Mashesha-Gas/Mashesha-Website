<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No static description/OG tags in this source file — every route
         renders its own via <SEO> (src/components/SEO.jsx), which React 19
         hoists into <head> once the app has mounted. That's enough for real
         visitors, but link-preview bots (WhatsApp, Facebook, ...) and most
         search crawlers never run that JS, so scripts/prerender-seo.mjs
         bakes the same tags into a static per-route copy of this file after
         `vite build` (see package.json) — dist/index.html itself for "/",
         dist/products/index.html for "/products", etc. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Mashesha — Gas shup shup.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
