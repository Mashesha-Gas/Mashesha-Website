server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames (e.g. index-Xy12.js) are safe to cache aggressively —
    # a new build always gets a new filename, so there's no staleness risk.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached — it's what points at the current
    # hashed asset filenames, so a stale cached copy silently keeps serving
    # old JS/CSS after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
